# =============================================================================
# Pipeline Recipes (from .github knowledge)
# =============================================================================
pipeline_recipes:
  - id: pipeline_001
    timestamp: '2026-03-18'
    pattern: scheduler_timeout_for_cropper_hailonet
    description: >
      When hailonet with batch-size > 1 is inside a hailocropper path,
      it receives variable crop counts per frame. Without scheduler-timeout-ms,
      the batch waits indefinitely for crops that may never arrive.
      Fix: Set scheduler-timeout-ms to 1000/target_fps (e.g., 33 for 30fps).
    impact: "Latency reduction: 64% (257ms -> 93ms) in gesture_detection"
    tags: [scheduler-timeout, hailonet, hailocropper, batch-size, latency]

# =============================================================================
# Bottleneck Patterns (merged from both sources, deduplicated)
# =============================================================================
bottleneck_patterns:
  # --- From profile-pipeline ---
  - pattern: queue_fill_pct > 80 on bypass queue
    suggestion: Increase bypass queue max_size_buffers (INFERENCE_PIPELINE_WRAPPER default is 20)
    confidence: 0.8
    times_confirmed: 0

  - pattern: videoconvert in top 3 proctime
    diagnosis: CPU-bound pixel format conversion
    suggestion: Increase n-threads to 3-4, consider using NV12 format to reduce conversion overhead
    fix: "Increase n-threads to 3-4, consider NV12 format"
    confidence: 0.8
    times_confirmed: 0

  - pattern: videoscale in top 3 proctime
    suggestion: Increase n-threads to 3-4, reduce input resolution at source if possible
    confidence: 0.7
    times_confirmed: 0

  - pattern: hailonet highest proctime
    suggestion: Tune batch-size and scheduler-timeout-ms, verify HEF model is optimized for target arch
    confidence: 0.9
    times_confirmed: 0

  - pattern: element proctime p95 > 2x mean
    suggestion: Add leaky queue before element to absorb jitter spikes
    confidence: 0.7
    times_confirmed: 0

  - pattern: all CPUs > 90%
    diagnosis: Overall CPU saturation
    suggestion: Reduce source resolution or frame rate, pipeline is CPU-bound
    fix: "Reduce resolution or frame rate"
    confidence: 0.9
    times_confirmed: 0

  # --- From .github knowledge (unique entries not covered above) ---
  - pattern: "hailonet highest proctime, downstream of hailocropper"
    diagnosis: Batch stall — variable crop count causes partial batch waiting
    fix: "Add scheduler-timeout-ms={1000/fps} to hailonet element"
    confidence: 0.95

  - pattern: "queue P50 low but P95 > 10x P50"
    diagnosis: Downstream element periodically blocks (not a queue sizing issue)
    fix: "Fix downstream bottleneck first, not the queue"
    confidence: 0.85

  - pattern: "bypass queue fill > 70%"
    diagnosis: Inference slower than source, frames backing up
    fix: "Increase bypass max_size_buffers, consider reducing source FPS"
    confidence: 0.8

# =============================================================================
# Insights (merged from both sources)
# =============================================================================
insights:
  # --- From profile-pipeline ---
  - text: 'QUEUE() defaults: max_size_buffers=3, max_size_bytes=0, max_size_time=0, leaky=no'
    tags:
    - queue
    - defaults
    timestamp: '2026-03-09'

  - text: INFERENCE_PIPELINE_WRAPPER bypass_max_size_buffers default is 20
    tags:
    - queue
    - bypass
    - inference
    timestamp: '2026-03-09'

  - text: GStreamerApp default pipeline_latency=300ms
    tags:
    - latency
    - pipeline
    timestamp: '2026-03-09'

  - text: SOURCE_PIPELINE uses videoscale n-threads=2 and videoconvert n-threads=3
    tags:
    - source
    - threads
    - videoconvert
    timestamp: '2026-03-09'

  - text: When hailonet is inside a hailocropper path, batch-size>1 without scheduler-timeout-ms causes severe stalls. The number
      of crops per frame is variable (depends on detections), so the batch often waits indefinitely for more crops. Always set
      scheduler-timeout-ms on hailonet elements downstream of hailocropper. Use 1000/target_fps as the timeout value (e.g. 33ms
      for 30fps).
    tags:
    - hailonet,hailocropper,scheduler-timeout,batch-size,best-practice
    timestamp: '2026-03-10'

  - text: "High queue proctime with low median but high P95 (e.g. palm_bypass_q: P50=1.5ms, P95=50ms) indicates the queue is\
      \ mostly empty but periodically blocked waiting for a downstream element. Look at what's downstream \u2014 if it's a hailonet\
      \ with batch stalls, fixing the batch/scheduler issue fixes the queue too."
    tags:
    - queue,proctime,jitter,diagnosis
    timestamp: '2026-03-10'

  # --- From .github knowledge ---
  - text: "VLM expects RGB 336x336 with central crop, not letterbox padding"
    tags: [vlm, preprocessing, image]

  - text: "vlm.clear_context() MUST be called after each inference, or context accumulates and quality degrades"
    tags: [vlm, context, critical]

  - text: "Backend.close() must send None sentinel to worker process via request_queue to prevent orphaned processes"
    tags: [backend, multiprocessing, cleanup]

  - text: "QT_QPA_PLATFORM=xcb must be set BEFORE importing cv2 on headless Linux"
    tags: [opencv, display, environment]

  - text: "get_usb_video_devices() uses udevadm and filters virtual devices — returns device indices, not /dev paths"
    tags: [camera, usb, discovery]

  - text: "SHARED_VDEVICE_GROUP_ID enables multi-process device sharing. Without it, only one process can access the Hailo chip"
    tags: [vdevice, multiprocessing, critical]

  - text: "VLM token '<|im_end|>' must be filtered from streaming output"
    tags: [vlm, streaming, tokens]

  - text: "Camera release must happen in same thread as read() — cross-thread release can crash OpenCV"
    tags: [camera, threading, critical]

