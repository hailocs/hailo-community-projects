hybrid_overlay_plus_userframe:
  description: "Pipeline with hailooverlay_community before callback for C++ bboxes + Python extras"
  used_by: []
  when_to_use: "Apps needing both fast bbox rendering and custom Python drawing (zones, counters, alerts)"
  code: |
    # In get_pipeline_string():
    # The KEY is placing the overlay BEFORE the user callback identity element.
    # This way, when the callback extracts the frame, bboxes are already drawn.

    from hailo_apps.python.core.gstreamer.gstreamer_helper_pipelines import (
        SOURCE_PIPELINE, INFERENCE_PIPELINE, INFERENCE_PIPELINE_WRAPPER,
        TRACKER_PIPELINE, USER_CALLBACK_PIPELINE, OVERLAY_PIPELINE, QUEUE,
    )

    def get_pipeline_string(self):
        source = SOURCE_PIPELINE(video_source=self.video_source)
        inference = INFERENCE_PIPELINE(hef_path=self.hef_path, post_process_so=self.post_process_so,
                                        post_function_name=self.post_function_name, batch_size=self.batch_size)
        inference_wrapper = INFERENCE_PIPELINE_WRAPPER(inference)
        tracker = TRACKER_PIPELINE(class_id=-1)

        # OVERLAY BEFORE CALLBACK — bboxes rendered at C++ speed
        overlay = OVERLAY_PIPELINE(community=True)
        user_callback = USER_CALLBACK_PIPELINE()

        # Note: no DISPLAY_PIPELINE here — we handle display manually
        pipeline = (
            f"{source} ! {inference_wrapper} ! {tracker} ! "
            f"{overlay} ! {user_callback} ! "
            f"videoconvert ! {QUEUE()} ! fpsdisplaysink video-sink={self.video_sink} sync={self.sync}"
        )
        return pipeline

