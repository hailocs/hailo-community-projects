web_control_panel:
  description: "Flask web control panel for parameter adjustment alongside GStreamer/OpenCV video display"
  used_by: []
  when_to_use: "Any app where users need a web-based control panel (sliders, buttons, settings) while video displays via GStreamer/OpenCV window"
  code: |
    import threading
    from flask import Flask, jsonify, request, render_template_string

    # Shared state between pipeline callback and web server
    class AppState:
        def __init__(self):
            self.threshold = 0.5
            self.target_labels = ["person"]
            self.count = 0
            self.fps = 0.0
            self.lock = threading.Lock()

    app_state = AppState()

    # Flask app (runs in background thread)
    flask_app = Flask(__name__)

    CONTROL_HTML = """
    <!DOCTYPE html><html><head><title>App Control Panel</title>
    <style>body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:0 20px}
    .slider-container{margin:20px 0} input[type=range]{width:100%}
    .status{background:#f0f0f0;padding:15px;border-radius:8px;margin:20px 0}</style></head>
    <body><h1>Control Panel</h1>
    <div class="status" id="status">Loading...</div>
    <div class="slider-container"><label>Confidence Threshold: <span id="thresh-val">0.5</span></label>
    <input type="range" min="0" max="100" value="50" id="threshold"
           oninput="document.getElementById('thresh-val').textContent=(this.value/100).toFixed(2);
                    fetch('/api/threshold',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({value:this.value/100})})"></div>
    <script>setInterval(()=>fetch('/api/status').then(r=>r.json()).then(d=>{
    document.getElementById('status').innerHTML=
    `Count: ${d.count} | FPS: ${d.fps.toFixed(1)} | Threshold: ${d.threshold}`}),1000)</script>
    </body></html>"""

    @flask_app.route("/")
    def index():
        return render_template_string(CONTROL_HTML)

    @flask_app.route("/api/status")
    def status():
        with app_state.lock:
            return jsonify(count=app_state.count, fps=app_state.fps, threshold=app_state.threshold)

    @flask_app.route("/api/threshold", methods=["POST"])
    def set_threshold():
        data = request.get_json()
        with app_state.lock:
            app_state.threshold = float(data["value"])
        return jsonify(ok=True)

    def start_web_server(port=8080):
        """Start Flask in a daemon thread. Call from main() before app.run()."""
        thread = threading.Thread(target=lambda: flask_app.run(host="0.0.0.0", port=port, debug=False), daemon=True)
        thread.start()
        print(f"Web control panel at http://localhost:{port}")

    # In main():
