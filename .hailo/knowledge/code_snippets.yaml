            {"role": "assistant", "content": [{"type": "text", "text": full_response}]}
        )

    def vlm_chat_fn(message, image, history):
        """Gradio VLM chat with image upload."""
        import cv2
        import numpy as np
        if image is not None:
            # Gradio provides PIL Image, convert to numpy RGB
            img_array = np.array(image)
            img_resized = cv2.resize(img_array, (336, 336)).astype(np.uint8)
            prompt = [
                {"role": "user", "content": [
                    {"type": "image"},
                    {"type": "text", "text": message}
                ]}
            ]
            response = vlm.generate_all(prompt=prompt, frames=[img_resized], temperature=0.1, max_generated_tokens=200)
        else:
            prompt = [{"role": "user", "content": [{"type": "text", "text": message}]}]
            response = llm.generate_all(prompt=prompt, temperature=0.7, max_generated_tokens=256)
        return response.split("<|im_end|>")[0]

