user_frame_pygame:
  description: "Pattern for using --use-frame with pygame rendering instead of cv2.imshow"
  used_by: []
  when_to_use: "Pipeline apps needing pygame for custom graphics, game-like UI, or interactive displays"
  code: |
    import pygame
    import numpy as np
    import multiprocessing

    def pygame_display_process(frame_queue, width=1280, height=720):
        """Separate process for pygame rendering. Replaces default cv2.imshow display."""
        pygame.init()
        screen = pygame.display.set_mode((width, height))
        pygame.display.set_caption("Hailo App")
        clock = pygame.time.Clock()
        running = True

        while running:
            for event in pygame.event.get():
                if event.type == pygame.QUIT:
                    running = False

            try:
                frame = frame_queue.get_nowait()  # Non-blocking
                if frame is None:
                    break
                # frame is BGR from OpenCV, pygame expects RGB
                frame_rgb = frame[:, :, ::-1]  # BGR -> RGB
                frame_rgb = np.ascontiguousarray(frame_rgb)
                surface = pygame.surfarray.make_surface(frame_rgb.swapaxes(0, 1))
                surface = pygame.transform.scale(surface, (width, height))
                screen.blit(surface, (0, 0))

                # Draw custom pygame overlays here:
                # pygame.draw.rect(screen, (255, 0, 0), (10, 10, 200, 50), 2)
                # font = pygame.font.SysFont(None, 36)
                # text = font.render("Custom Info", True, (0, 255, 0))
                # screen.blit(text, (20, 20))

                pygame.display.flip()
            except Exception:
                pass

            clock.tick(30)

        pygame.quit()

