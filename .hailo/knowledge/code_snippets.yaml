user_frame_with_detections:
  description: "Draw bboxes/labels/landmarks from Hailo ROI metadata onto user-frame (no hailooverlay)"
  used_by: []
  when_to_use: "When using user-frame without hailooverlay and you need to manually draw detection info"
  code: |
    import cv2
    import hailo
    from hailo_apps.python.core.common.buffer_utils import get_caps_from_pad, get_numpy_from_buffer

    # Color map for common COCO classes
    LABEL_COLORS = {
        "person": (0, 255, 0),
        "car": (255, 100, 0),
        "truck": (200, 100, 50),
        "default": (0, 200, 255),
    }

    def draw_detections_on_frame(frame, detections, width, height):
        """Draw bboxes, labels, confidence, and track IDs from Hailo metadata."""
        for detection in detections:
            label = detection.get_label()
            confidence = detection.get_confidence()
            bbox = detection.get_bbox()

            # Convert normalized coords to pixels
            x1 = int(bbox.xmin() * width)
            y1 = int(bbox.ymin() * height)
            x2 = int((bbox.xmin() + bbox.width()) * width)
            y2 = int((bbox.ymin() + bbox.height()) * height)

            color = LABEL_COLORS.get(label, LABEL_COLORS["default"])

            # Draw bbox
            cv2.rectangle(frame, (x1, y1), (x2, y2), color, 2)

            # Get track ID if available
            track_id = 0
            track = detection.get_objects_typed(hailo.HAILO_UNIQUE_ID)
            if len(track) == 1:
                track_id = track[0].get_id()

            # Draw label + confidence + track ID
            text = f"{label} {confidence:.0%}"
            if track_id > 0:
                text += f" ID:{track_id}"
            text_y = max(15, y1 - 5)
            cv2.putText(frame, text, (x1, text_y), cv2.FONT_HERSHEY_SIMPLEX, 0.5, color, 2)

            # Draw landmarks if present (pose keypoints)
            landmarks = detection.get_objects_typed(hailo.HAILO_LANDMARKS)
            for lm in landmarks:
                for point in lm.get_points():
                    px = int((point.x() * bbox.width() + bbox.xmin()) * width)
                    py = int((point.y() * bbox.height() + bbox.ymin()) * height)
                    cv2.circle(frame, (px, py), 3, (255, 0, 255), -1)

    # In callback:
    # pad = element.get_static_pad("src")
