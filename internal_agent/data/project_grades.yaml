# ============================================================================
# PROJECT GRADES — Quality scores for all indexed Hailo community projects
# ============================================================================
# This is the single source of truth for project grading.
# Grades drive ordering in the public index and visibility decisions.
#
# Scoring: 0 (none) to 3 (excellent) per dimension
# Weights: code_quality=25%, community_signal=20%, freshness=20%,
#          completeness=20%, hailo_integration=15%
